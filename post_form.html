{% extends "base.html" %}
{% block title %}New Post • My Blog{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8">
      <h2 class="mb-3">Write a new post</h2>
      <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary">Publish</button>
      </form>
    </div>
  </div>
{% endblock %}
