{% extends "base.html" %}
{% block title %}Signup • My Blog{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2 class="mb-3">Create an account</h2>
      <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success">Sign up</button>
      </form>
    </div>
  </div>
{% endblock %}
